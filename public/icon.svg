<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="50%" style="stop-color:#f7931e"/>
      <stop offset="100%" style="stop-color:#ffcd3c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff"/>
      <stop offset="100%" style="stop-color:#2ed573"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="512" height="512" rx="110" fill="none" stroke="#1e90ff" stroke-width="8" opacity="0.4"/>
  <!-- Flame body -->
  <path d="M256 80 C256 80 310 150 320 210 C330 260 300 280 300 280 C310 240 280 220 270 200 C260 180 265 140 256 80Z" fill="url(#flame)" opacity="0.9"/>
  <path d="M256 80 C256 80 200 155 195 215 C190 265 220 285 220 285 C205 245 230 220 240 200 C250 180 248 140 256 80Z" fill="url(#flame)" opacity="0.75"/>
  <!-- Main flame center -->
  <path d="M256 110 C256 110 295 175 300 230 C305 275 275 305 256 320 C237 305 207 275 212 230 C217 175 256 110 256 110Z" fill="url(#flame)"/>
  <!-- Inner blue flame core -->
  <path d="M256 200 C256 200 275 230 272 260 C270 280 256 295 256 295 C256 295 242 280 240 260 C237 230 256 200 256 200Z" fill="url(#blue)" opacity="0.9"/>
  <!-- Bottom text "kcal" -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="88" fill="url(#blue)" opacity="0.95">kcal</text>
</svg>
